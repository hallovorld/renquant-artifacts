name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: renquant-artifacts
          # Full history so the append-only guard can worktree the PR base
          # commit and diff the candidate canonical INDEX against it.
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-common
          path: renquant-common
      # Publish-time peer dep (RFC RenQuant#492 §5): sibling checkout only,
      # NOT pip-installed — the phase-3 binding tests import the
      # import-light renquant_pipeline.bundle_contract via the pytest
      # pythonpath entry and read the phase-2 fixture vectors from this
      # checkout; installing renquant-pipeline would drag its heavy
      # runtime deps into a repo that must stay importable without them.
      - uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-pipeline
          path: renquant-pipeline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test tools
        run: python -m pip install -e renquant-common -e renquant-artifacts pytest
      - name: Test
        working-directory: renquant-artifacts
        run: make test
      # Required gate: the canonical-publication INDEX.json is append-only
      # across commits. A PR that deletes a historical entry or rewrites an
      # existing entry's metadata fails HERE (machine-enforced), not on a human
      # reading the diff. Inert until the first canonical publication lands.
      - name: Canonical INDEX append-only guard (candidate vs PR base)
        if: github.event_name == 'pull_request'
        working-directory: renquant-artifacts
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          git worktree add ../artifacts-base FETCH_HEAD
          python scripts/verify_canonical_index_transition.py \
            --base ../artifacts-base/registry/canonical_publications \
            --candidate registry/canonical_publications
