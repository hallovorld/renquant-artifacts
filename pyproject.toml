[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renquant-artifacts"
version = "0.3.0"
description = "Artifact registry and validation workflows for RenQuant."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["renquant-common>=0.5,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# ../renquant-pipeline/src: publish-time peer dep (RFC RenQuant#492 §5) —
# the phase-3 binding tests import renquant_pipeline.bundle_contract
# (import-light by that module's pinned contract) and read the phase-2
# fixture vectors from the sibling checkout. The package itself stays
# importable without renquant-pipeline (lazy import inside the factory,
# pinned by a subprocess test); this entry is test plumbing, NOT an
# install dependency.
pythonpath = ["src", "../renquant-common/src", "../renquant-pipeline/src"]
testpaths = ["tests"]
